<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поїздки нашого села</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0; padding: 0;
            background-color: var(--tg-theme-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #222);
        }
        .tabs {
            display: flex;
            background-color: var(--tg-theme-secondary-bg-color, #fff);
            border-bottom: 1px solid #ddd;
            position: sticky; top: 0; z-index: 100;
        }
        .tab-btn {
            flex: 1; padding: 15px; text-align: center;
            font-weight: bold; cursor: pointer;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active {
            border-bottom-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-color, #3390ec);
        }
        .content { padding: 15px; max-width: 500px; margin: 0 auto; }
        .hidden { display: none; }
        
        .ride-card {
            background: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 12px; padding: 15px; margin-bottom: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
        .ride-route { font-size: 18px; font-weight: bold; color: var(--tg-theme-button-color, #3390ec); }
        .ride-info { font-size: 14px; margin: 8px 0; line-height: 1.4; }
        .ride-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; flex-wrap: wrap; gap: 8px; }
        .seats-badge {
            background: #e6f2ff; color: #0066cc;
            padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 13px;
        }
        .badge-my { background: #fff3cd; color: #856404; }
        .badge-booked { background: #d4edda; color: #155724; }
        
        input, select {
            width: 100%; padding: 12px; margin: 6px 0 15px;
            border: 1px solid #ccc; border-radius: 8px;
            box-sizing: border-box; font-size: 16px;
        }
        label { font-size: 14px; font-weight: bold; }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .btn-action {
            padding: 8px 14px; font-size: 14px; width: auto; border-radius: 6px;
        }
        .btn-cancel {
            background-color: #dc3545 !important;
            color: #fff !important;
        }
    </style>
</head>
<body>

<div class="tabs">
    <div class="tab-btn active" onclick="switchTab('search')">🔍 Знайти поїздку</div>
    <div class="tab-btn" onclick="switchTab('create')">➕ Запропонувати</div>
</div>

<!-- ВКАДКА 1: ПОШУК ПОЇЗДОК -->
<div id="tab-search" class="content">
    <div id="rides-list">🔄 Завантаження поїздок...</div>
</div>

<!-- ВКЛАДКА 2: СТВОРЕННЯ ПОЇЗДКИ -->
<div id="tab-create" class="content hidden">
    <h3>Запропонувати поїздку</h3>
    
    <label>Звідки:</label>
    <input type="text" id="from" value="Покровське" placeholder="Наприклад: Покровське (центр)">
    
    <label>Куди:</label>
    <input type="text" id="to" value="Полтава" placeholder="Наприклад: Полтава (зал. вокзал)">
    
    <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label>Дата:</label>
            <input type="date" id="date">
        </div>
        <div style="flex: 1;">
            <label>Час виїзду:</label>
            <input type="time" id="time" value="08:00">
        </div>
    </div>
    
    <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label>Вільних місць:</label>
            <input type="number" id="seats" value="3" min="1" max="8">
        </div>
        <div style="flex: 1;">
            <label>Ціна з пасажира (або коментар):</label>
            <input type="text" id="price" value="100 грн" placeholder="Безкоштовно / 100 грн">
        </div>
    </div>
    
    <button class="btn" onclick="submitRide()">🚀 Опублікувати поїздку</button>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user || { id: 12345, first_name: "Тестовий", username: "test_user" };
    
    // 🚨🚨 ВСТАВ СЮДИ СВОЮ ПОСИЛАННЯ НА APPS SCRIPT: 🚨🚨
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwInc9qMr6vP3ybAwnp76HsJPvA-PX1ayZREiIY1U4YuRRhXYaTaeviBMTJeeahlRfl/exec";

    document.getElementById('date').valueAsDate = new Date();

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById('tab-search').classList.add('hidden');
        document.getElementById('tab-create').classList.add('hidden');
        
        if (tab === 'search') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-search').classList.remove('hidden');
            loadRides();
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-create').classList.remove('hidden');
        }
    }

    // --- ЛОГІКА 1: Завантаження списку поїздок ---
    function loadRides() {
        const container = document.getElementById("rides-list");
        container.innerHTML = "🔄 Завантаження поїздок...";
        
        fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "get_rides", userId: user.id })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status !== "success") {
                container.innerHTML = "❌ Помилка завантаження даних.";
                return;
            }
            if (data.rides.length === 0) {
                container.innerHTML = "<p style='text-align:center; color:#888; margin-top:40px;'>Поки немає активних поїздок.<br>Будьте першим, хто запропонує!</p>";
                return;
            }

            container.innerHTML = "";
            data.rides.forEach(ride => {
                let badgeHtml = `<span class="seats-badge">Місць: ${ride.seats}</span>`;
                let actionBtnHtml = `<button class="btn btn-action" onclick="bookRide('${ride.id}', ${ride.rowIdx}, '${ride.driverId}', '${ride.from}➔${ride.to} (${ride.dateTimeDisplay})')">Забронювати</button>`;

                // Якщо це власна поїздка водія
                if (ride.isMyRide) {
                    badgeHtml = `<span class="seats-badge badge-my">Моя поїздка (Вільних: ${ride.seats})</span>`;
                    actionBtnHtml = `<button class="btn btn-action btn-cancel" onclick="cancelRide('${ride.id}', ${ride.rowIdx}, '${ride.from}➔${ride.to} (${ride.dateTimeDisplay})')">❌ Скасувати поїздку</button>`;
                } 
                // Якщо користувач вже забронював цю поїздку
                else if (ride.isBookedByMe) {
                    badgeHtml = `<span class="seats-badge badge-booked">✅ Заброньовано вами</span>`;
                    actionBtnHtml = `<button class="btn btn-action btn-cancel" onclick="cancelBooking('${ride.id}', ${ride.rowIdx}, '${ride.driverId}', '${ride.from}➔${ride.to} (${ride.dateTimeDisplay})')">❌ Скасувати бронь</button>`;
                }

                const card = document.createElement("div");
                card.className = "ride-card";
                card.innerHTML = `
                    <div class="ride-route">🚗 ${ride.from} ➔ ${ride.to}</div>
                    <div class="ride-info">
                        📅 <b>${ride.dateTimeDisplay}</b><br>
                        👤 Водій: ${ride.driverName} <br>
                        💰 Ціна: ${ride.price}
                    </div>
                    <div class="ride-meta">
                        ${badgeHtml}
                        ${actionBtnHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        })
        .catch(err => {
            container.innerHTML = "❌ Помилка зв'язку з сервером.";
        });
    }

    // --- ЛОГІКА 2: Створення поїздки ---
    function submitRide() {
        const from = document.getElementById("from").value;
        const to = document.getElementById("to").value;
        const date = document.getElementById("date").value;
        const time = document.getElementById("time").value;
        const seats = document.getElementById("seats").value;
        const price = document.getElementById("price").value;

        if (!from || !to || !date || !time) {
            alert("Будь ласка, заповніть усі поля!");
            return;
        }

        const btn = document.querySelector("#tab-create .btn");
        btn.innerText = "⏳ Публікуємо...";
        btn.disabled = true;

        const payload = {
            action: "create_ride",
            user: { id: user.id, name: user.first_name, username: user.username },
            from, to, date, time, seats, price
        };

        fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            btn.innerText = "🚀 Опублікувати поїздку";
            btn.disabled = false;
            if (data.status === "success") {
                alert("✅ Поїздку успішно створено!");
                switchTab('search');
            } else {
                alert("Помилка: " + data.message);
            }
        });
    }

    // --- ЛОГІКА 3: Бронювання місця ---
    function bookRide(rideId, rowIdx, driverId, rideDetails) {
        if (!confirm(`Бронюємо 1 місце на поїздку:\n${rideDetails}?`)) return;

        const payload = {
            action: "book_ride",
            rideId: rideId,
            rowIdx: rowIdx,
            driverId: driverId,
            rideDetails: rideDetails,
            passenger: { id: user.id, name: user.first_name, username: user.username }
        };

        fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                alert("🎉 Місце заброньовано!\nВодію відправлено сповіщення у Telegram з вашими контактами.");
                loadRides();
            } else {
                alert("❌ Помилка: " + data.message);
            }
        });
    }

    // --- ЛОГІКА 4: Скасування поїздки водієм ---
    function cancelRide(rideId, rowIdx, rideDetails) {
        if (!confirm(`Ви впевнені, що хочете скасувати поїздку:\n${rideDetails}?\n\nУсім пасажирам, які встигли забронювати місця, прийде сповіщення в Telegram.`)) return;

        fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "cancel_ride", rideId: rideId, rowIdx: rowIdx, rideDetails: rideDetails })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                alert("🗑️ Поїздку скасовано!");
                loadRides();
            } else {
                alert("❌ Помилка: " + data.message);
            }
        });
    }

    // --- ЛОГІКА 5: Скасування броні пасажиром ---
    function cancelBooking(rideId, rowIdx, driverId, rideDetails) {
        if (!confirm(`Скасувати ваше бронювання на поїздку:\n${rideDetails}?`)) return;

        fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ 
                action: "cancel_booking", 
                rideId: rideId, 
                rowIdx: rowIdx, 
                driverId: driverId,
                rideDetails: rideDetails,
                userId: user.id,
                userName: user.first_name
            })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === "success") {
                alert("✅ Бронювання скасовано. Водію надіслано сповіщення, а вільне місце повернуто в поїздку!");
                loadRides();
            } else {
                alert("❌ Помилка: " + data.message);
            }
        });
    }

    loadRides();
</script>
</body>
</html>
