<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест Mini App</title>
    <!-- Подключаем официальную библиотеку Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            /* Используем цвета самой темы Телеграма пользователя */
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        .box {
            max-width: 400px;
            margin: 0 auto;
        }
        textarea {
            width: 100%;
            height: 80px;
            margin-top: 10px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="box">
    <h2 id="greeting">Привет! Загружаю данные...</h2>
    <p>Напиши что-нибудь, и мы отправим это в Гугл-таблицу:</p>
    
    <textarea id="msgInput" placeholder="Текст сообщения..."></textarea>
    <button id="sendBtn">Отправить в летопись</button>
    <div id="status"></div>
</div>

<script>
    // 1. Инициализируем Telegram Web App
    const tg = window.Telegram.WebApp;
    tg.ready(); // Говорим Телеграму, что приложение загрузилось

    // 2. Вытаскиваем данные пользователя, который открыл аппку
    const user = tg.initDataUnsafe?.user || { id: 0, first_name: "Инкогнито (тест в браузере)" };
    
    // 3. Меняем заголовок — приветствуем по имени из Телаграмата!
    document.getElementById("greeting").innerText = `Привет, ${user.first_name}! 👋`;

    // 4. СЮДА ВСТАВИШЬ ССЫЛКУ ИЗ ГУГЛ-СКРИПТА:
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyzfDP5qMPWnR40DKJ3Oig5U2-lO4kDJTD08E4hE8noFoGusxfCvL-CBNgPX1TIsFae/exec";

    // 5. Логика отправки
    document.getElementById("sendBtn").addEventListener("click", function() {
        const text = document.getElementById("msgInput").value;
        const statusDiv = document.getElementById("status");

        if (!text) {
            alert("Напиши хоть пару слов!");
            return;
        }

        statusDiv.innerText = "Отправляем...";
        statusDiv.style.color = "blue";

        // Собираем посылку
        const payload = {
            userId: user.id,
            userName: user.first_name + (user.last_name ? " " + user.last_name : ""),
            message: text
        };

        // Отправляем в Гугл-таблицу через Apps Script
        // Важно: используем text/plain, чтобы браузер не ругался на CORS (защиту от чужих сайтов)
        fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === "success") {
                statusDiv.innerText = "✅ Успешно записано в таблицу!";
                statusDiv.style.color = "green";
                document.getElementById("msgInput").value = ""; // Очищаем поле
            } else {
                statusDiv.innerText = "❌ Ошибка: " + data.message;
                statusDiv.style.color = "red";
            }
        })
        .catch(error => {
            statusDiv.innerText = "❌ Ошибка сети!";
            statusDiv.style.color = "red";
            console.error(error);
        });
    });
</script>

</body>
</html>
