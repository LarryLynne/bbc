<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поїздки нашого села</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css?v=999">
</head>
<body>

<!-- 🚨 Вкладки зверху (ТЕПЕР ЇХ ТРИ) -->
<div class="tabs">
    <div class="tab-btn active" onclick="switchTab('search')">🔍 Знайти</div>
    <div class="tab-btn" onclick="switchTab('create')">➕ Запропонувати</div>
    <div class="tab-btn" onclick="switchTab('subs')">🔔 Підписки</div>
</div>

<!-- ВКЛАДКА 1: ПОШУК ТА ФІЛЬТРИ -->
<div id="tab-search" class="content">
    <div class="filters-box">
        <input type="text" id="filter-query" placeholder="🔍 Куди чи звідки? (напр. Полтава)" oninput="applyFilters()">
        <div class="filter-row">
            <input type="date" id="filter-date" onchange="applyFilters()">
            <button class="btn-reset" onclick="resetFilters()">Скинути</button>
        </div>
    </div>
    <div id="rides-list"></div>
</div>

<!-- ВКЛАДКА 2: СТВОРЕННЯ ПОЇЗДКИ -->
<div id="tab-create" class="content hidden">
    <h3>Запропонувати поїздку</h3>
    <label>Звідки:</label>
    <input type="text" id="from" value="Покровське" placeholder="Наприклад: Покровське (центр)">
    <label>Куди:</label>
    <input type="text" id="to" value="Полтава" placeholder="Наприклад: Полтава (зал. вокзал)">
    
    <div class="form-row">
        <div><label>Дата:</label><input type="date" id="date"></div>
        <div><label>Час виїзду:</label><input type="time" id="time" value="08:00"></div>
    </div>
    
    <div class="form-row">
        <div><label>Вільних місць:</label><input type="number" id="seats" value="3" min="1" max="8"></div>
        <div><label>Ціна або коментар:</label><input type="text" id="price" value="100 грн" placeholder="Безкоштовно / 100 грн"></div>
    </div>
    <button class="btn" id="btn-submit" onclick="submitRide()">🚀 Опублікувати поїздку</button>
</div>

<!-- 🚨 ВКЛАДКА 3: ПІДПИСКИ -->
<div id="tab-subs" class="content hidden">
    <div class="sub-form-box">
        <h4 style="margin-top:0; margin-bottom:8px;">🔔 Чекаєте на поїздку?</h4>
        <p style="font-size:13px; color:#555; margin-bottom:12px;">Створіть підписку, і бот надішле вам сповіщення в Telegram, щойно водій опублікує відповідний маршрут!</p>
        
        <label>Звідки:</label>
        <input type="text" id="sub-from" value="Покровське" placeholder="Наприклад: Покровське">
        <label>Куди:</label>
        <input type="text" id="sub-to" value="Полтава" placeholder="Наприклад: Полтава">
        <label>Дата (необов'язково, можна залишити порожнім для будь-якої дати):</label>
        <input type="date" id="sub-date">
        
        <button class="btn" style="background:#28a745;" onclick="submitSub()">🔔 Підписатися на сповіщення</button>
    </div>

    <h4 style="margin-top:20px;">Мої активні підписки:</h4>
    <div id="subs-list"></div>
</div>

<!-- МОДАЛЬНЕ ВІКНО ДЛЯ СПИСКУ ПАСАЖИРІВ -->
<div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
        <div class="modal-header">
            <h4 id="modal-title">👥 Пасажири поїздки</h4>
            <button class="btn-close-modal" onclick="closeModal()">✕</button>
        </div>
        <div id="passengers-list" class="modal-body">
            🔄 Завантаження списку...
        </div>
    </div>
</div>

<script src="app.js?v=999"></script>
</body>
</html>
